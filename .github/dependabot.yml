# Dependency updates for the story tooling, the opt-in desktop (Tauri) and
# Android (Capacitor) packaging projects, the dev container and the workflows.
# Each ecosystem gets one weekly PR for minor and patch updates, a separate PR
# per major update, and grouped security updates. New releases wait a week
# before Dependabot proposes them; security updates are not delayed.
version: 2

updates:
  - package-ecosystem: npm
    directories:
      - "/"
      - "/pack/capacitor"
    schedule:
      interval: weekly
    # The starter does not commit lockfiles, so updates raise the minimum
    # version in package.json
    versioning-strategy: increase
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: "/pack/tauri/src-tauri"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      cargo-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: "/pack/capacitor/android"
    schedule:
      interval: weekly
    # The Gradle wrapper and the Android Gradle plugin move together with
    # Capacitor (`npx cap migrate`): Gradle 9.6 and later cannot load AGP 8
    ignore:
      - dependency-name: gradle-wrapper
        update-types: ["version-update:semver-major"]
      - dependency-name: com.android.tools.build:gradle
        update-types: ["version-update:semver-major"]
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      gradle-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      gradle-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: devcontainers
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
