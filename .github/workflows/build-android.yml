name: Build Android APK

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write # needed to attach files to the release

jobs:
  build:
    runs-on: ubuntu-latest

    # Job-level so the step `if` below can see it (a step's own env isn't
    # available to its `if`, and the secrets context isn't allowed there)
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21 # Capacitor 7 compiles for Java 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - run: npm install

      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore

      - name: Build story and package for Android
        run: npx vite build
        env:
          NODE_ENV: production
          SPINDLE_PACK_TARGETS: android
          SPINDLE_KEYSTORE_PATH: ${{ env.KEYSTORE_BASE64 != '' && '/tmp/release.keystore' || '' }}
          SPINDLE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SPINDLE_KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'release' }}
          SPINDLE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: dist/pack/android/
          if-no-files-found: error

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for file in dist/pack/android/*.apk; do
            gh release upload "${{ github.event.release.tag_name }}" "$file" --clobber
          done
