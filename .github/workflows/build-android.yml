name: Build Android APK

on:
  workflow_dispatch:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    # The template itself has spindlePack disabled; rohal12/spindle-starter-demo builds the binaries
    if: github.repository != 'rohal12/spindle-starter'
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to attach files to the release

    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # Release and deploy builds never restore a cache a PR could have written
          package-manager-cache: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21 # Capacitor 8 needs Java 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      # Without a keystore the APK is signed with a debug key that Gradle
      # generates fresh on every runner. Android refuses to update an installed
      # game with an APK signed by a different key, so players would have to
      # uninstall (and lose their saves) for every release.
      - name: Require a signing keystore for releases
        if: github.event_name == 'release'
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Release APKs require both KEYSTORE_BASE64 and KEYSTORE_PASSWORD secrets (see docs/publishing.md, 'Signing Android releases')."
            exit 1
          fi

      - run: npm ci

      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore

      - name: Build story and package for Android
        run: npx vite build
        env:
          NODE_ENV: production
          SPINDLE_PACK_TARGETS: android
          SPINDLE_ANDROID_RELEASE: ${{ github.event_name == 'release' && '1' || '' }}
          SPINDLE_KEYSTORE_PATH: ${{ env.KEYSTORE_BASE64 != '' && '/tmp/release.keystore' || '' }}
          SPINDLE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SPINDLE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SPINDLE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apk
          path: dist/pack/android/
          if-no-files-found: error

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          for file in dist/pack/android/*.apk; do
            gh release upload "$TAG" "$file" --clobber
          done
