name: Deploy to itch.io

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Butler channel"
        required: false
        default: "html5"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # Release and deploy builds never restore a cache a PR could have written
          package-manager-cache: false

      - run: npm ci

      - run: npm run lint

      - run: npm run build
        env:
          NODE_ENV: production
          # Skip desktop/Android/JoiPlay packaging if spindlePack is enabled
          SPINDLE_PACK_TARGETS: none

      - uses: remarkablegames/setup-butler@64c286ef04cbc1e3ef65914939d34187ae29c422 # v3.0.4

      - run: butler push dist/ "$ITCH_USER/$ITCH_GAME:$CHANNEL"
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_USER: ${{ vars.ITCH_USER }}
          ITCH_GAME: ${{ vars.ITCH_GAME }}
          CHANNEL: ${{ inputs.channel }}
