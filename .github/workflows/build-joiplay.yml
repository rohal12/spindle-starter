name: Build JoiPlay Package

on:
  workflow_dispatch:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    # The template itself has spindlePack disabled; rohal12/spindle-starter-demo builds the binaries
    if: github.repository != 'rohal12/spindle-starter'
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to attach files to the release

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # Release and deploy builds never restore a cache a PR could have written
          package-manager-cache: false

      - run: npm install

      - name: Build story and package for JoiPlay
        run: npx vite build
        env:
          NODE_ENV: production
          SPINDLE_PACK_TARGETS: joiplay

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: joiplay-zip
          path: dist/pack/joiplay/
          if-no-files-found: error

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          for file in dist/pack/joiplay/*.zip; do
            gh release upload "$TAG" "$file" --clobber
          done
