name: Gradle wrapper

# Checks the committed pack/capacitor/android gradle-wrapper.jar against
# Gradle's published checksums. Kept separate and small: OpenSSF Scorecard
# only accepts the jar when a validation run on the latest commit has already
# succeeded, and the full CI run takes longer than Scorecard does.

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  validate:
    name: Validate Gradle wrapper
    # Template-only
    if: github.repository == 'rohal12/spindle-starter'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
