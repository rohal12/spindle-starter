name: Workflow lint

# zizmor audits the workflows and dependabot.yml for security issues
# (template injection, unpinned actions, broad permissions); findings go to
# code scanning. It runs on every pull request, not only workflow changes:
# the main ruleset requires its check and its code scanning results.

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  zizmor:
    name: zizmor
    # Template-only
    if: github.repository == 'rohal12/spindle-starter'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload results to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: 1.31.1
