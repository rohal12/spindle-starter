name: Dependencies

# The starter commits no lockfiles, so GitHub's dependency graph sees only the
# ranges in package.json and Cargo.toml, and nothing from Gradle: no transitive
# package gets Dependabot alerts or dependency review. `snapshot` resolves the
# npm and Cargo trees without installing them (scripts/dependency-snapshot.mjs)
# and `gradle` resolves the Android app's runtime classpaths; `submit` sends
# both to the dependency submission API, so Dependabot alerts cover them.

on:
  push:
    branches: [main]
  # Catches up after releases upstream, which change what a fresh install gets
  schedule:
    - cron: "23 4 * * *"
  # Dependabot auto-merge runs it for a merge that started no push workflows
  workflow_dispatch:

permissions: {}

concurrency:
  group: dependencies-${{ github.ref }}

jobs:
  snapshot:
    name: npm and Cargo snapshot
    # Template-only
    if: github.repository == 'rohal12/spindle-starter'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Writes package-lock.json and Cargo.lock only: nothing is installed or run
      - name: Resolve the npm and Cargo trees
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          (cd pack/capacitor && npm install --package-lock-only --ignore-scripts --no-audit --no-fund)
          cargo metadata --format-version 1 --manifest-path pack/tauri/src-tauri/Cargo.toml > "$RUNNER_TEMP/cargo-metadata.json"

      - name: List the resolved packages
        run: |
          node scripts/dependency-snapshot.mjs \
            --npm package.json=package-lock.json \
            --npm pack/capacitor/package.json=pack/capacitor/package-lock.json \
            --cargo "pack/tauri/src-tauri/Cargo.toml=$RUNNER_TEMP/cargo-metadata.json" \
            > "$RUNNER_TEMP/snapshot.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-snapshot
          path: ${{ runner.temp }}/snapshot.json
          if-no-files-found: error
          retention-days: 1

  gradle:
    name: Gradle dependency graph
    # Template-only
    if: github.repository == 'rohal12/spindle-starter'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      # The Android project includes Capacitor's Gradle modules from
      # node_modules and the plugin module `cap sync` generates; the root
      # install provides the TypeScript that reads capacitor.config.ts
      - name: Prepare the Capacitor Android project
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          cd pack/capacitor
          npm install --ignore-scripts --no-audit --no-fund
          mkdir -p web-assets && echo '<!doctype html>' > web-assets/index.html
          npx cap sync android

      # Only what goes into the APK: the Android Gradle plugin's own tooling
      # has advisories that only an AGP (and so Capacitor) upgrade can fix
      - uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          build-root-directory: pack/capacitor/android
          dependency-graph: generate-and-upload
          dependency-graph-include-configurations: ^(debug|release)RuntimeClasspath$
          artifact-retention-days: 1

  submit:
    name: Submit dependency graphs
    needs: [snapshot, gradle]
    if: ${{ !cancelled() && github.repository == 'rohal12/spindle-starter' }}
    runs-on: ubuntu-latest
    permissions:
      # The dependency submission API needs it. The job checks out nothing and
      # runs no repository code: it sends what the read-only jobs produced.
      contents: write
    steps:
      - if: needs.snapshot.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dependency-snapshot
          path: ${{ runner.temp }}/snapshot

      - name: Submit the npm and Cargo snapshot
        if: needs.snapshot.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/dependency-graph/snapshots" --input "$RUNNER_TEMP/snapshot/snapshot.json"

      - if: needs.gradle.result == 'success'
        uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          dependency-graph: download-and-submit

      - name: Fail when a graph could not be built
        if: needs.snapshot.result != 'success' || needs.gradle.result != 'success'
        env:
          SNAPSHOT: ${{ needs.snapshot.result }}
          GRADLE: ${{ needs.gradle.result }}
        run: |
          echo "::error::npm and Cargo snapshot: $SNAPSHOT, Gradle graph: $GRADLE"
          exit 1

