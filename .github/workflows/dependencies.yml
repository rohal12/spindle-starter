name: Dependencies

# GitHub's dependency graph reads the committed lockfiles itself (the npm
# lockfiles in the root and pack/capacitor, and the Tauri app's Cargo.lock),
# but sees nothing from Gradle, so no Gradle package would get Dependabot
# alerts or dependency review. `gradle` resolves the Android app's runtime
# classpaths and `submit` sends them to the dependency submission API. On a
# pull request, `Dependency review` then fails when the change brings in a
# package version with a known vulnerability of moderate severity or higher,
# in any scope.

on:
  push:
    branches: [main]
  pull_request:
  # Catches up after releases upstream, which change what a fresh install gets
  schedule:
    - cron: "23 4 * * *"
  # Dependabot auto-merge runs it for a merge that started no push workflows
  workflow_dispatch:

permissions: {}

concurrency:
  group: dependencies-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gradle:
    name: Gradle dependency graph
    # Template-only
    if: github.repository == 'rohal12/spindle-starter'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      # The Android project includes Capacitor's Gradle modules from
      # node_modules and the plugin module `cap sync` generates; the root
      # install provides the TypeScript that reads capacitor.config.ts
      - name: Prepare the Capacitor Android project
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          cd pack/capacitor
          npm ci --ignore-scripts --no-audit --no-fund
          mkdir -p web-assets && echo '<!doctype html>' > web-assets/index.html
          npx cap sync android

      # Only what goes into the APK: the Android Gradle plugin's own tooling
      # has advisories that only an AGP (and so Capacitor) upgrade can fix
      - uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          build-root-directory: pack/capacitor/android
          dependency-graph: generate-and-upload
          dependency-graph-include-configurations: ^(debug|release)RuntimeClasspath$
          artifact-retention-days: 1

  submit:
    name: Submit dependency graphs
    needs: gradle
    # A pull request from a fork gets a token that cannot submit
    if: >-
      !cancelled()
      && github.repository == 'rohal12/spindle-starter'
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      # The dependency submission API needs it. The job checks out nothing and
      # runs no repository code: it sends what the read-only job produced.
      contents: write
    steps:
      - if: needs.gradle.result == 'success'
        uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          dependency-graph: download-and-submit

      - name: Fail when the graph could not be built
        if: needs.gradle.result != 'success'
        env:
          GRADLE: ${{ needs.gradle.result }}
        run: |
          echo "::error::Gradle graph: $GRADLE"
          exit 1

  dependency-review:
    name: Dependency review
    needs: submit
    if: ${{ !cancelled() && github.repository == 'rohal12/spindle-starter' && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          # Everything the starter installs from npm is a dev dependency
          fail-on-scopes: runtime, development, unknown
          # glib 0.18 (Tauri's GTK 3 stack, no 0.20 there): nothing in the
          # tree calls the unsound VariantStrIter; see Dependabot alert #2
          allow-ghsas: GHSA-wrw7-89jp-8q8g
          # Waits until GitHub has processed the snapshot `submit` sent
          retry-on-snapshot-warnings: true
