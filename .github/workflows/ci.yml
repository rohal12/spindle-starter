name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Dependabot auto-merge runs it for a merge that started no push workflows
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, test and build
    # Template-only: projects created from the starter run their own builds
    if: github.repository == 'rohal12/spindle-starter'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - run: npm install

      - run: npm run lint

      - run: npm test

      - run: npm run build
        env:
          NODE_ENV: production
          SPINDLE_PACK_TARGETS: none

      - run: npm run docs:build
