name: Build Desktop Executables

on:
  workflow_dispatch:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    # The template itself has spindlePack disabled; rohal12/spindle-starter-demo builds the binaries
    if: github.repository != 'rohal12/spindle-starter'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            artifact: dist/pack/windows/
          - os: macos-latest
            target: macos
            artifact: dist/pack/macos/
          - os: ubuntu-latest
            target: linux
            artifact: dist/pack/linux/

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # needed to attach files to the release

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # Release and deploy builds never restore a cache a PR could have written
          package-manager-cache: false

      - name: Install the stable Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm install

      - name: Build story and package for ${{ matrix.target }}
        run: npx vite build
        env:
          NODE_ENV: production
          SPINDLE_PACK_TARGETS: ${{ matrix.target }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.target }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

      - name: Attach to release
        if: github.event_name == 'release'
        shell: bash # windows-latest defaults to PowerShell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          ARTIFACT_DIR: ${{ matrix.artifact }}
        run: |
          for file in "$ARTIFACT_DIR"*; do
            gh release upload "$TAG" "$file" --clobber
          done
