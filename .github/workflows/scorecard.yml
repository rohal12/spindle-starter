name: Scorecard

# OpenSSF Scorecard supply-chain checks; results go to code scanning and the
# public Scorecard API. The Scorecard API rejects results from workflows with
# top-level env, defaults or write permissions, so keep this workflow minimal.

on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: "41 5 * * 1"

permissions: {}

jobs:
  # Scorecard accepts the committed gradle-wrapper.jar only when
  # gradle-wrapper.yml has already succeeded on the commit it scans; on a
  # push both start together, and a busy runner queue let Scorecard win.
  wait:
    name: Wait for the Gradle wrapper check
    if: github.repository == 'rohal12/spindle-starter' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read # read gradle-wrapper.yml's runs
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SHA: ${{ github.sha }}
    steps:
      - run: |
          for _ in $(seq 1 40); do
            state=$(gh run list --workflow gradle-wrapper.yml --commit "$SHA" --json status,conclusion --jq '.[0] // {} | "\(.status)/\(.conclusion)"')
            case "$state" in
              completed/*) echo "Gradle wrapper check: $state"; exit 0 ;;
            esac
            sleep 20
          done
          echo "::warning::The Gradle wrapper check has not finished; Scorecard may report gradle-wrapper.jar"

  analysis:
    name: Scorecard analysis
    needs: wait
    # Template-only. Scheduled runs skip `wait`: the check finished long ago.
    if: ${{ !cancelled() && github.repository == 'rohal12/spindle-starter' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload results to code scanning
      id-token: write # publish results to the Scorecard API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
